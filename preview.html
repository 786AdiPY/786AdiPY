<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Preview: Retro Newsprint Profile (Light & Dark)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'IBM Plex Mono', monospace;
      transition: background-color 0.2s ease, color 0.2s ease;
      padding-bottom: 60px;
    }

    /* Theme Modes */
    body.theme-light {
      background-color: #F1EDE4;
      color: #111111;
    }
    body.theme-dark {
      background-color: #0D1117;
      color: #E8E4DA;
    }

    /* Top Control Bar */
    .controls-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 17, 23, 0.95);
      border-bottom: 1px solid #30363d;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #f0f6fc;
      backdrop-filter: blur(8px);
    }
    .controls-bar .title {
      font-size: 14px;
      font-weight: 700;
    }
    .toggle-btn {
      background: #21262d;
      color: #f0f6fc;
      border: 1px solid #30363d;
      padding: 6px 14px;
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.15s ease;
    }
    .toggle-btn:hover {
      background: #30363d;
      border-color: #8b949e;
    }

    /* Container matching GitHub README 830px max width */
    .readme-wrapper {
      max-width: 830px;
      margin: 32px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .readme-section img {
      width: 100%;
      display: block;
      border-radius: 4px;
    }

    .masthead-text {
      text-align: center;
      line-height: 1.8;
      font-size: 13px;
      margin: 8px 0;
    }
    .masthead-text strong {
      font-size: 14px;
      letter-spacing: 1px;
    }
    .masthead-text code {
      background: rgba(128, 128, 128, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    hr.rule {
      border: none;
      height: 1px;
      background: currentColor;
      opacity: 0.3;
      margin: 12px 0;
    }

    .section-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .contact-footer {
      text-align: center;
      font-size: 12px;
      margin-top: 12px;
    }
    .contact-footer a {
      color: inherit;
      text-decoration: underline;
      margin: 0 8px;
    }
  </style>
</head>
<body class="theme-light">

  <div class="controls-bar">
    <div class="title">Retro Newsprint Preview (830px Width)</div>
    <div>
      <button class="toggle-btn" id="themeToggle" onclick="toggleTheme()">Switch to Dark Mode</button>
    </div>
  </div>

  <main class="readme-wrapper">
    <!-- Banner -->
    <div class="readme-section">
      <img id="bannerImg" src="assets/banner-light.svg" alt="Banner" />
    </div>

    <!-- Masthead tagline & slash list -->
    <div class="masthead-text">
      <strong>ADITHYA A M</strong> · <code>@786AdiPY</code> · <strong>TECH ENTHUSIAST</strong><br>
      <code>/ Full-Stack Developer</code> &nbsp; <code>/ AI Engineer</code> &nbsp; <code>/ Systems &amp; Security</code>
    </div>

    <hr class="rule">

    <!-- Featured -->
    <div class="section-title">■ FEATURED</div>
    <div class="readme-section">
      <a href="https://github.com/786AdiPY/RangeShield-AI" target="_blank">
        <img id="featuredImg" src="assets/featured-light.svg" alt="Featured: RangeShield-AI" />
      </a>
    </div>

    <hr class="rule">

    <!-- Now -->
    <div class="section-title">■ NOW</div>
    <div class="readme-section">
      <img id="nowImg" src="assets/now-light.svg" alt="Now: Building, Learning, Reading" />
    </div>

    <hr class="rule">

    <!-- Stack -->
    <div class="section-title">■ STACK</div>
    <div class="readme-section">
      <img id="stackImg" src="assets/stack-light.svg" alt="Stack" />
    </div>

    <hr class="rule">

    <!-- Stats -->
    <div class="section-title">■ STATS</div>
    <div class="readme-section">
      <img id="statsImg" src="assets/stats-light.svg" alt="Stats & Activity" />
    </div>

    <hr class="rule">

    <!-- Contact line -->
    <div class="contact-footer">
      <a href="https://linkedin.com/in/adithya-am-adi" target="_blank"><code>LinkedIn: in/adithya-am-adi</code></a> ·
      <a href="mailto:adithya@example.com"><code>Email: adithya@example.com</code></a> ·
      <a href="https://adithya.dev" target="_blank"><code>Portfolio: adithya.dev</code></a>
    </div>
  </main>

  <script>
    let isDark = false;
    function toggleTheme() {
      isDark = !isDark;
      const body = document.body;
      const btn = document.getElementById('themeToggle');
      const suffix = isDark ? '-dark.svg' : '-light.svg';
      
      body.className = isDark ? 'theme-dark' : 'theme-light';
      btn.innerText = isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode';

      document.getElementById('bannerImg').src = 'assets/banner' + suffix;
      document.getElementById('featuredImg').src = 'assets/featured' + suffix;
      document.getElementById('nowImg').src = 'assets/now' + suffix;
      document.getElementById('stackImg').src = 'assets/stack' + suffix;
      document.getElementById('statsImg').src = 'assets/stats' + suffix;
    }
  </script>
</body>
</html>
